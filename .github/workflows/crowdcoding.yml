name: crowdcoding
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The signed envelope rides in the PR body (base64) so merging keeps the repo clean —
      # no binary blob in history. Extract it here for the seal to verify. The PR body is
      # passed via env (never inlined into the script) to avoid injection from a hostile body.
      - name: Extract the signed envelope from the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .crowdcoding
          printf '%s' "$PR_BODY" \
            | sed -n '/crowdcoding-envelope:v1/,/-->/p' \
            | sed '1d;$d' \
            | base64 -d > .crowdcoding/contribution.cc.zip

      # Make the repo's own test runner available, then run the Marketplace Action.
      - run: pip install pytest
      - id: seal
        uses: augbastos/crowdcoding@v0.1.2

      - name: Post the seal comment
        run: |
          pipx run crowdcoding seal \
            --from-results "${{ steps.seal.outputs.results }}" \
            --render-comment \
          | gh pr comment "${{ github.event.pull_request.number }}" --body-file -
        env:
          GH_TOKEN: ${{ github.token }}
